<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"/>
  <title>Bible Flashcards: Bridge Illustration Evangelism (ESV)</title>
  
  <meta name="theme-color" content="#3b82f6"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  
  <style>
    :root {
      --primary: #3b82f6;
      --success: #16a34a;
      --warning: #ca8a04;
      --danger: #dc2626;
      --gray: #6b7280;
      --light-bg: #f8fafc;
      --card-bg: white;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; font-family:system-ui, -apple-system, sans-serif; background:linear-gradient(to bottom, #f0f7ff, #e0eaff); color:#1e293b; }
    body { min-height:100vh; padding:clamp(12px,4vw,20px); line-height:1.5; }
    .container { max-width:900px; margin:0 auto; background:var(--card-bg); border-radius:24px; padding:clamp(1.5rem,6vw,2.5rem); box-shadow:0 20px 50px rgba(0,0,0,0.12); }
    h1 { font-size:clamp(1.8rem,7vw,2.5rem); color:var(--primary); text-align:center; margin-bottom:0.6em; font-weight:700; }
    .download-container { text-align:center; margin-bottom:2rem; }
    .stats { display:flex; justify-content:space-around; background:var(--light-bg); padding:1rem; border-radius:16px; margin-bottom:1rem; font-size:clamp(0.9rem,3vw,1rem); transition:all 0.4s; }
    .stat { text-align:center; }
    .stat-number { font-size:1.4em; font-weight:bold; color:var(--primary); }
    #progress { text-align:center; margin:0.5rem 0 1.5rem; font-weight:bold; color:var(--primary); font-size:1.1rem; }
    .flashcard { perspective:1000px; height:clamp(320px,65vh,480px); margin:1.8rem auto; position:relative; }
    .card-inner { position:relative; width:100%; height:100%; text-align:center; transition:transform 0.6s cubic-bezier(0.68,-0.55,0.27,1.55); transform-style:preserve-3d; cursor:pointer; }
    .flashcard.flipped .card-inner { transform:rotateY(180deg); }
    .card-face { position:absolute; width:100%; height:100%; backface-visibility:hidden; background:white; border-radius:20px; padding:clamp(1.8rem,7vw,2.8rem); box-shadow:0 15px 40px rgba(0,0,0,0.15); display:flex; flex-direction:column; justify-content:flex-start; align-items:center; border:2px solid #e2e8f0; overflow-y:auto; }
    .card-back { transform:rotateY(180deg); }
    .reference { font-weight:700; color:var(--primary); font-size:clamp(1.5rem,5.5vw,2rem); margin-bottom:1.2rem; text-align:center; }
    .verse { font-size:clamp(1.15rem,4.5vw,1.4rem); line-height:1.65; white-space:pre-wrap; word-break:break-word; max-width:100%; margin:1rem 0; }
    .prompt { font-size:clamp(1.05rem,4vw,1.25rem); color:#4b5563; font-style:italic; margin:1.5rem 0 1rem; text-align:center; max-width:92%; }
    .explanation { font-size:clamp(1rem,3.8vw,1.15rem); color:#4b5563; margin-top:1.5rem; line-height:1.6; max-width:92%; border-top:1px solid #e5e7eb; padding-top:1rem; }
    .rating-buttons { display:flex; gap:0.7rem; justify-content:center; flex-wrap:wrap; margin-top:1.8rem; }
    .rating-btn { padding:clamp(0.8rem,3.5vw,1rem) clamp(1.2rem,4vw,1.8rem); border:none; border-radius:12px; font-size:clamp(0.95rem,3.8vw,1.1rem); font-weight:600; cursor:pointer; transition:all 0.2s; min-width:80px; touch-action:manipulation; }
    .btn-again { background:var(--danger); color:white; }
    .btn-hard   { background:var(--warning); color:white; }
    .btn-good   { background:var(--success); color:white; }
    .btn-easy   { background:var(--primary); color:white; }
    .rating-btn:active { transform:scale(0.94); }
    .controls { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:2rem; }
    button { padding:clamp(0.8rem,3.5vw,1rem) clamp(1.2rem,4.5vw,1.8rem); font-size:clamp(0.95rem,3.8vw,1.1rem); border:none; border-radius:12px; cursor:pointer; transition:all 0.2s; min-width:110px; touch-action:manipulation; }
    .btn-primary { background:var(--primary); color:white; }
    .btn-secondary { background:var(--gray); color:white; }
    button:active { transform:scale(0.97); }
    .hidden { display:none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>Bible Flashcards: Bridge Illustration (ESV)</h1>
  
  <div class="download-container">
    <button id="downloadBtn" class="btn-primary">Save App (.html)</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-number" id="cardCount">0</div><div>Total</div></div>
    <div class="stat"><div class="stat-number" id="mastered">0</div><div>Mastered</div></div>
    <div class="stat"><div class="stat-number" id="streak">0</div><div>Streak</div></div>
  </div>

  <div id="progress">Card 1 of 9</div>

  <div id="flashcard" class="flashcard">
    <div class="card-inner">
      <div class="card-face">
        <div class="reference" id="refFront"></div>
        <div class="prompt" id="promptFront"></div>
        <div class="hint" style="margin-top:auto; color:#9ca3af; font-size:0.95rem;">Tap card to flip</div>
      </div>
      <div class="card-face card-back">
        <div class="reference" id="refBack"></div>
        <div class="verse" id="verseBack"></div>
        <div class="explanation" id="explanation"></div>
      </div>
    </div>
  </div>

  <div class="rating-buttons hidden" id="ratingBtns">
    <button class="rating-btn btn-again" data-rating="1">Again</button>
    <button class="rating-btn btn-hard"  data-rating="2">Hard</button>
    <button class="rating-btn btn-good"  data-rating="3">Good</button>
    <button class="rating-btn btn-easy"  data-rating="4">Easy</button>
  </div>

  <div class="controls">
    <button id="flipBtn" class="btn-primary">Flip</button>
    <button id="nextBtn" class="btn-primary">Next</button>
    <button id="resetBtn" class="btn-secondary">Reset</button>
  </div>
</div>

<script>
// ============== CONFIG ==============
const MASTERY_THRESHOLD = 3;
// ====================================

const verses = [
  { ref: "Step 1: God's Side",               prompt: "What does Scripture say about God's heart toward us?", text: "John 3:16 – \"For God so loved the world, that he gave his only Son, that whoever believes in him should not perish but have eternal life.\"\nRomans 5:8 – \"but God shows his love for us in that while we were still sinners, Christ died for us.\"", explanation: "God loves you and desires relationship. Draw GOD on the right side." },
  { ref: "Step 2: Our Side (Sin)",           prompt: "What is humanity's universal problem?", text: "Romans 3:23 – \"for all have sinned and fall short of the glory of God\"", explanation: "All have sinned. Draw US (stick figure) on the left side." },
  { ref: "Step 3: The Gap (Separation)",     prompt: "What does sin ultimately earn?", text: "Romans 6:23 – \"For the wages of sin is death...\"", explanation: "Sin causes separation/death. Draw wide chasm between sides." },
  { ref: "Step 4: Failed Attempts",          prompt: "Can good works close the gap?", text: "Ephesians 2:8–9 – \"For by grace you have been saved through faith. And this is not your own doing; it is the gift of God, not a result of works...\"", explanation: "Good deeds/religion fall short. Draw broken ladders." },
  { ref: "Step 5: God's Solution (Cross)",   prompt: "How did God solve the problem?", text: "Romans 6:23 – \"...but the free gift of God is eternal life in Christ Jesus our Lord.\"\nRomans 5:8", explanation: "Christ died for us. Draw cross bridging the gap." },
  { ref: "Step 6: The Bridge is Jesus",      prompt: "Who is the only way to God?", text: "John 14:6 – \"Jesus said to him, 'I am the way, and the truth, and the life. No one comes to the Father except through me.'\"", explanation: "Jesus is the unique bridge. Label cross 'JESUS CHRIST'." },
  { ref: "Step 7: Crossing by Faith",        prompt: "How do we cross the bridge?", text: "John 1:12 – \"But to all who did receive him, who believed in his name, he gave the right to become children of God\"", explanation: "By faith — receive Him. Draw person crossing on cross." },
  { ref: "Step 8: Our Response",             prompt: "What should we do personally?", text: "Romans 10:9 – \"if you confess with your mouth that Jesus is Lord and believe in your heart... you will be saved.\"\nRomans 10:13 – \"everyone who calls on the name of the Lord will be saved.\"", explanation: "Confess Jesus is Lord & believe. Call on Him." },
  { ref: "Step 9: Assurance",                prompt: "What do we have after crossing?", text: "Romans 5:1 – \"Therefore, since we have been justified by faith, we have peace with God...\"\nRomans 8:1 – \"There is therefore now no condemnation for those who are in Christ Jesus.\"", explanation: "Peace, no condemnation, eternal security." }
];

let cards = verses.map((v, i) => ({
  id: i,
  ref: v.ref,
  prompt: v.prompt,
  text: v.text,
  explanation: v.explanation,
  interval: 1,
  due: 0,
  reviews: 0,
  goodReviews: 0,
  mastered: false
}));

let streak = 0;
let isFlipped = false;
let currentCard = cards[0];

const els = {
  flashcard:    document.getElementById('flashcard'),
  cardCount:    document.getElementById('cardCount'),
  mastered:     document.getElementById('mastered'),
  streakEl:     document.getElementById('streak'),
  refFront:     document.getElementById('refFront'),
  promptFront:  document.getElementById('promptFront'),
  refBack:      document.getElementById('refBack'),
  verseBack:    document.getElementById('verseBack'),
  explanation:  document.getElementById('explanation'),
  ratingBtns:   document.getElementById('ratingBtns'),
  flipBtn:      document.getElementById('flipBtn'),
  nextBtn:      document.getElementById('nextBtn'),
  resetBtn:     document.getElementById('resetBtn'),
  downloadBtn:  document.getElementById('downloadBtn'),
  progress:     document.getElementById('progress')
};

function saveProgress() {
  localStorage.setItem('bridgeFlashcards', JSON.stringify({cards, streak, currentCardId: currentCard?.id ?? 0}));
}

function loadProgress() {
  const saved = localStorage.getItem('bridgeFlashcards');
  if (!saved) return;
  try {
    const data = JSON.parse(saved);
    cards = data.cards.map(c => ({...c, goodReviews: c.goodReviews ?? 0, mastered: !!c.mastered}));
    streak = Number(data.streak) || 0;
    const savedId = Number(data.currentCardId);
    currentCard = cards.find(c => c.id === savedId) || cards[0];
  } catch(e) {
    console.error("Load failed", e);
  }
}

function updateStats() {
  const masteredCount = cards.filter(c => c.mastered).length;
  els.cardCount.textContent = cards.length;
  els.mastered.textContent  = masteredCount;
  els.streakEl.textContent  = streak;
  els.progress.textContent  = `Card ${currentCard ? cards.indexOf(currentCard)+1 : 1} of ${cards.length}`;
  
  const stats = document.querySelector('.stats');
  stats.style.backgroundColor = '#dcfce7';
  setTimeout(() => stats.style.backgroundColor = '', 700);
}

function showCard(card) {
  if (!card) return;
  currentCard = card;
  
  els.refFront.textContent   = card.ref;
  els.promptFront.textContent = card.prompt;
  els.refBack.textContent    = card.ref;
  els.verseBack.innerHTML    = card.text.replace(/\n/g, '<br>');
  els.explanation.textContent = card.explanation || '';

  els.flashcard.classList.remove('flipped');
  isFlipped = false;
  els.ratingBtns.classList.add('hidden');
  els.flipBtn.textContent = 'Flip';
  
  updateStats();
  saveProgress();
}

function getNextCard() {
  const now = Date.now();
  let candidates = cards.filter(c => c.due <= now || c.reviews === 0);
  
  if (candidates.length === 0) {
    candidates = [...cards].sort((a,b) => (a.goodReviews - b.goodReviews) || (a.due - b.due));
  }
  
  return candidates[0] || cards[0];
}

function flipCard() {
  isFlipped = !isFlipped;
  els.flashcard.classList.toggle('flipped', isFlipped);
  els.flipBtn.textContent = isFlipped ? 'Flip Back' : 'Flip';
  els.ratingBtns.classList.toggle('hidden', !isFlipped);
}

function rateCard(rating) {
  if (!currentCard) return;

  currentCard.reviews += 1;

  if (rating === 1) {           // Again
    currentCard.interval = 1;
    streak = 0;
  } else if (rating === 2) {    // Hard
    currentCard.interval = Math.max(1, Math.round(currentCard.interval * 1.3));
    streak = 0;
  } else {                      // Good or Easy
    currentCard.goodReviews += 1;
    streak += 1;
    currentCard.interval = Math.round(currentCard.interval * (rating === 4 ? 2.2 : 1.8));
  }

  currentCard.due = Date.now() + currentCard.interval * 86400000; // ms in a day

  if (currentCard.goodReviews >= MASTERY_THRESHOLD && !currentCard.mastered) {
    currentCard.mastered = true;
  }

  saveProgress();
  updateStats();
  
  // Brief visual feedback
  els.flashcard.style.opacity = '0.6';
  setTimeout(() => {
    els.flashcard.style.opacity = '1';
    showCard(getNextCard());
  }, 400);
}

// Event listeners
els.flipBtn.addEventListener('click', flipCard);
els.nextBtn.addEventListener('click', () => showCard(getNextCard()));

els.flashcard.addEventListener('click', e => {
  if (e.target.closest('.rating-buttons') || e.target.closest('.controls') || e.target.closest('button')) return;
  flipCard();
});

document.querySelectorAll('.rating-btn').forEach(btn => {
  btn.addEventListener('click', () => rateCard(Number(btn.dataset.rating)));
});

els.resetBtn.addEventListener('click', () => {
  if (!confirm('Reset all progress?')) return;
  localStorage.removeItem('bridgeFlashcards');
  cards = verses.map((v,i) => ({id:i, ref:v.ref, prompt:v.prompt, text:v.text, explanation:v.explanation, interval:1, due:0, reviews:0, goodReviews:0, mastered:false}));
  streak = 0;
  currentCard = cards[0];
  saveProgress();
  showCard(currentCard);
});

els.downloadBtn.addEventListener('click', () => {
  const blob = new Blob([document.documentElement.outerHTML], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `bridge-flashcards-${new Date().toISOString().slice(0,10)}.html`;
  a.click();
  URL.revokeObjectURL(url);
});

// Swipe support
let touchStartX = 0;
els.flashcard.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX, {passive:true});
els.flashcard.addEventListener('touchend', e => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) < 70) return;
  if (diff > 0) { // left swipe
    if (isFlipped) rateCard(3); // Good
  } else {        // right swipe
    flipCard();
  }
});

// Start
loadProgress();
showCard(currentCard || cards[0]);
</script>
</body>
</html>
